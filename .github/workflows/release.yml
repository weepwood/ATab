name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate extension artifact
        run: node scripts/validate-extension.mjs

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Package extension ZIP
        run: python3 scripts/package-extension.py

      - name: Install Playwright Chromium
        run: pnpm --filter @atab/e2e exec playwright install --with-deps chromium

      - name: Chromium extension smoke test
        env:
          ATAB_EXTENSION_DIR: ${{ github.workspace }}/apps/extension/dist
        run: xvfb-run -a pnpm --filter @atab/e2e smoke

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            artifacts/atab-extension-*.zip
            artifacts/atab-extension-*.zip.sha256
          )
          if (( ${#assets[@]} != 2 )); then
            printf '预期 2 个发布附件，实际找到 %s 个\n' "${#assets[@]}" >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "ATab ${GITHUB_REF_NAME}"
          fi

      - name: Upload failed Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report-${{ github.sha }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
